{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Add Product</h2>

    <form method="post" action="/products/add">

        <div class="mb-3">
            <label class="form-label">ASIN</label>
            <input type="text" class="form-control" name="asin" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Product Title</label>
            <input type="text" class="form-control" name="title" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Brand</label>
            <input type="text" class="form-control" name="brand" required>
        </div>

        <div class="row">

            <div class="col-md-6">
                <label class="form-label">Buy Price (£)</label>
                <input type="number" step="0.01" class="form-control" name="buy_price" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Sell Price (£)</label>
                <input type="number" step="0.01" class="form-control" name="sell_price" required>
            </div>

        </div>

        <br>

        <button class="btn btn-primary">
            Save Product
        </button>

        <a href="/products" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
