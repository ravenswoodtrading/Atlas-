<!DOCTYPE html>
<html>
<head>
    <title>Atlas Product Analysis</title>
</head>
<body>

<h1>Atlas</h1>

<h2>{{ product.title }}</h2>

<table border="1" cellpadding="8">
    <tr><td><b>ASIN</b></td><td>{{ product.asin }}</td></tr>
    <tr><td><b>Brand</b></td><td>{{ product.brand }}</td></tr>
    <tr><td><b>Manufacturer</b></td><td>{{ product.manufacturer }}</td></tr>
</table>

</body>
</html>
